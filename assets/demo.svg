<svg width="760" height="420" viewBox="0 0 760 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vuln-monkey terminal demo">
  <defs>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:14px}
      .l{opacity:0;animation:rise .35s ease forwards}
      @keyframes rise{from{opacity:0}to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      .cur{opacity:0;animation:show .01s linear forwards 3.9s, blink 1.1s steps(1) infinite 3.9s}
      @keyframes show{to{opacity:1}}
    </style>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="744" height="404" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="8" y="8" width="744" height="40" rx="12" fill="#161b22"/>
  <rect x="8" y="36" width="744" height="12" fill="#161b22"/>
  <circle cx="34" cy="28" r="6" fill="#f85149"/>
  <circle cx="54" cy="28" r="6" fill="#d29922"/>
  <circle cx="74" cy="28" r="6" fill="#3fb950"/>
  <text x="380" y="33" text-anchor="middle" class="mono" fill="#6e7681" font-size="12.5">vuln-monkey — api security fuzzer</text>

  <g class="mono">
    <!-- command -->
    <g class="l" style="animation-delay:.15s">
      <text x="28" y="84"><tspan fill="#56d364">$</tspan> <tspan fill="#e6edf3">npx vuln-monkey "curl https://api.example.com/orders/42 \</tspan></text>
    </g>
    <g class="l" style="animation-delay:.45s">
      <text x="28" y="106" fill="#adbac7">      -H 'Authorization: Bearer tok_live_***'"</text>
    </g>

    <g class="l" style="animation-delay:.9s">
      <text x="28" y="148"><tspan fill="#39c5cf">⟳</tspan>  <tspan fill="#8b949e">analyzing endpoint · model=claude-cli</tspan></text>
    </g>
    <g class="l" style="animation-delay:1.2s">
      <text x="28" y="172"><tspan fill="#56d364">✓</tspan>  <tspan fill="#8b949e">24 attack payloads generated</tspan></text>
    </g>

    <!-- findings -->
    <g class="l" style="animation-delay:1.7s">
      <text x="28" y="212"><tspan fill="#d29922">⚠</tspan>  <tspan fill="#e6edf3">IDOR</tspan>            <tspan fill="#8b949e">read order #41 as another user</tspan>     <tspan fill="#f85149" font-weight="700">HIGH</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.0s">
      <text x="28" y="236"><tspan fill="#d29922">⚠</tspan>  <tspan fill="#e6edf3">Mass assign</tspan>     <tspan fill="#8b949e">"role":"admin" via request body</tspan>    <tspan fill="#f85149" font-weight="700">HIGH</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.3s">
      <text x="28" y="260"><tspan fill="#d29922">⚠</tspan>  <tspan fill="#e6edf3">Info disc.</tspan>      <tspan fill="#8b949e">stack trace in 500 response</tspan>        <tspan fill="#d29922" font-weight="700">MED</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.6s">
      <text x="28" y="284"><tspan fill="#56d364">✓</tspan>  <tspan fill="#e6edf3">SSRF blocked</tspan>    <tspan fill="#8b949e">169.254.169.254 (cloud metadata)</tspan></text>
    </g>

    <g class="l" style="animation-delay:3.1s">
      <text x="28" y="324" fill="#30363d">────────────────────────────────────────────────────</text>
    </g>
    <g class="l" style="animation-delay:3.4s">
      <text x="28" y="352"><tspan fill="#adbac7">Risk</tspan>  <tspan fill="#e6edf3" font-weight="700">78 / 100</tspan>   <tspan fill="#f85149" font-weight="700">FAIL</tspan>      <tspan fill="#6e7681">report →</tspan> <tspan fill="#58a6ff">reports/orders.md</tspan></text>
    </g>

    <rect class="cur" x="28" y="378" width="9" height="16" fill="#56d364"/>
  </g>
</svg>
