<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vuln-monkey — AI-powered API security fuzzer">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2ea043" stroke-width="1" opacity=".13"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset=".82" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <text x="80" y="148" class="mono" font-size="64" font-weight="700" fill="#e6edf3">vuln<tspan fill="#3fdc5c">·monkey</tspan></text>
  <text x="84" y="188" class="sans" font-size="23" fill="#8b949e">AI-powered API security fuzzer</text>

  <g class="sans" font-size="14" font-weight="600" fill="#3fdc5c">
    <rect x="84" y="216" width="120" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="144" y="238" text-anchor="middle">SSRF-safe</text>
    <rect x="214" y="216" width="126" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="277" y="238" text-anchor="middle">LLM-driven</text>
    <rect x="350" y="216" width="158" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="429" y="238" text-anchor="middle">OpenAPI + curl</text>
  </g>
</svg>
