<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vuln-monkey — AI-powered API security fuzzer">
  <defs>
    <linearGradient id="bgA" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23262d"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fdc5c" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#3fdc5c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3fdc5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fdc5c" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#3fdc5c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3fdc5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fdc5c" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3fdc5c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2ea043" stroke-width="1" opacity=".12"/>
    </pattern>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect x="620" y="0" width="580" height="300" fill="url(#grid)"/>

  <!-- radar accent, right -->
  <g transform="translate(965 150)">
    <circle r="150" fill="url(#radar)"/>
    <circle r="72" fill="none" stroke="#2ea043" stroke-width="1" opacity=".28"/>
    <circle r="118" fill="none" stroke="#2ea043" stroke-width="1" stroke-dasharray="3 7" opacity=".22"/>
    <polygon points="0,0 132,-70 140,4" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="132" y2="-70" stroke="#3fdc5c" stroke-width="2" opacity=".75"/>
    <circle cx="132" cy="-70" r="4" fill="#3fdc5c"/>
    <circle cx="-96" cy="54" r="2.5" fill="#3fdc5c" opacity=".7"/>
    <circle cx="70" cy="96" r="2.5" fill="#3fdc5c" opacity=".55"/>
  </g>

  <!-- logo (c1), centered in radar -->
  <svg x="875" y="60" width="180" height="180" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="url(#bgA)" stroke="#30363d" stroke-width="3"/>
    <path fill="#0d0f13" d="M256 159c-77 0-137 56-137 137v74c0 43 35 78 78 78h118c43 0 78-35 78-78v-74c0-81-60-137-137-137Z"/>
    <circle cx="130" cy="299" r="58" fill="#101216"/>
    <circle cx="382" cy="299" r="58" fill="#101216"/>
    <path fill="#101216" d="M159 282c0-58 43-96 97-96s97 38 97 96v84c0 36-29 65-65 65h-64c-36 0-65-29-65-65v-84Z"/>
    <circle cx="200" cy="245" r="45" fill="#07080b"/>
    <circle cx="312" cy="245" r="45" fill="#07080b"/>
    <circle cx="200" cy="245" r="38" fill="url(#glowA)"/>
    <circle cx="312" cy="245" r="38" fill="url(#glowA)"/>
    <circle cx="200" cy="245" r="15" fill="#3fdc5c"/>
    <circle cx="312" cy="245" r="15" fill="#3fdc5c"/>
    <circle cx="239" cy="344" r="8" fill="#7f858d" opacity=".82"/>
    <circle cx="273" cy="344" r="8" fill="#7f858d" opacity=".82"/>
  </svg>

  <!-- left lockup -->
  <text x="80" y="142" class="mono" font-size="62" font-weight="700" fill="#e6edf3">vuln<tspan fill="#3fdc5c">·monkey</tspan></text>
  <text x="84" y="182" class="sans" font-size="22" fill="#8b949e">AI-powered API security fuzzer</text>

  <g class="sans" font-size="14" font-weight="600" fill="#3fdc5c">
    <rect x="84" y="210" width="118" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="143" y="232" text-anchor="middle">SSRF-safe</text>
    <rect x="212" y="210" width="124" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="274" y="232" text-anchor="middle">LLM-driven</text>
    <rect x="346" y="210" width="156" height="34" rx="17" fill="#2ea043" fill-opacity=".14" stroke="#3fdc5c"/>
    <text x="424" y="232" text-anchor="middle">OpenAPI + curl</text>
  </g>
</svg>
