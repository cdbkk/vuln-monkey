<svg width="880" height="200" viewBox="0 0 880 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vuln-monkey — AI-powered API security fuzzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.5">
      <stop stop-color="#2ea043" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="199" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="879" height="199" rx="16" fill="url(#glow)"/>

  <!-- monkey mark -->
  <g transform="translate(70 100)">
    <circle r="52" fill="#161b22" stroke="#30363d"/>
    <!-- ears -->
    <circle cx="-40" cy="-8" r="14" fill="#21262d" stroke="#30363d"/>
    <circle cx="40" cy="-8" r="14" fill="#21262d" stroke="#30363d"/>
    <circle cx="-40" cy="-8" r="6" fill="url(#grn)"/>
    <circle cx="40" cy="-8" r="6" fill="url(#grn)"/>
    <!-- face -->
    <path d="M-34 -6 a34 30 0 0 1 68 0 v6 a34 40 0 0 1 -68 0 z" fill="#21262d" stroke="#30363d"/>
    <ellipse cx="0" cy="16" rx="22" ry="17" fill="#0d1117"/>
    <!-- eyes -->
    <circle cx="-14" cy="-4" r="8" fill="#0d1117"/>
    <circle cx="14" cy="-4" r="8" fill="#0d1117"/>
    <circle cx="-12" cy="-6" r="3.4" fill="url(#grn)"/>
    <circle cx="16" cy="-6" r="3.4" fill="url(#grn)"/>
    <!-- nostrils -->
    <circle cx="-6" cy="14" r="2" fill="#484f58"/>
    <circle cx="6" cy="14" r="2" fill="#484f58"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92" class="mono" font-size="46" font-weight="700" fill="#e6edf3">vuln<tspan fill="url(#grn)">·</tspan><tspan fill="url(#grn)">monkey</tspan></text>
  <text x="152" y="126" class="sans" font-size="19" fill="#8b949e">AI-powered API security fuzzer</text>

  <!-- pills -->
  <g class="mono" font-size="12.5" fill="#7ee787">
    <rect x="152" y="146" width="98" height="26" rx="13" fill="#12261a" stroke="#238636"/>
    <text x="201" y="163" text-anchor="middle">SSRF-safe</text>
    <rect x="258" y="146" width="104" height="26" rx="13" fill="#12261a" stroke="#238636"/>
    <text x="310" y="163" text-anchor="middle">LLM-driven</text>
    <rect x="370" y="146" width="150" height="26" rx="13" fill="#12261a" stroke="#238636"/>
    <text x="445" y="163" text-anchor="middle">OpenAPI + curl</text>
  </g>

  <!-- faint prompt on the right -->
  <text x="840" y="176" text-anchor="end" class="mono" font-size="13" fill="#30363d">$ npx vuln-monkey</text>
</svg>
